# CORE HDS MAPPING: ONLY terms defined in the shared HDS Common Data Model (config/hds/hds-cdm.ttl).
# Every HDS field lab maps to these terms, so queries work across labs. Change this file only
# when the shared CDM changes (tests/test_hds_mapping.py fails if a term outside the CDM is added).
# Everything else (identifiers, coordinates, provenance, SafeVoice terms) is in mapping_application.yml.
#
# Not written yet, because no value has been agreed: hds:confidentiality, hds:status.
# Not collected: hds:casualties (applies to human trafficking), hds:outcome, hds:weaponsUsed.

# Column lists below are reused with YAML anchors (&name / *name).
x-columns:
  departure: &departure_cols
    - data_incident_departure_country
    - data_incident_departure_state
    - data_incident_departure_town
    - data_incident_departure_village
    - data_incident_departure_latitude
    - data_incident_departure_longitude
    - data_incident_departure_name
    - data_incident_departure_type
    - data_incident_departure_description
    - data_incident_departure_date
  destination: &destination_cols
    - data_incident_destination_country
    - data_incident_destination_state
    - data_incident_destination_town
    - data_incident_destination_village
    - data_incident_destination_latitude
    - data_incident_destination_longitude
    - data_incident_destination_name
    - data_incident_destination_type
    - data_incident_destination_description
    - data_incident_destination_date
  victim: &victim_cols
    - data_victim_number_of_victims
    - data_victim_nationality
    - data_victim_gender
    - data_victim_age
    - data_victim_situation
    - data_victim_description
    - data_victim_current_location_country
    - data_victim_current_location_state
    - data_victim_current_location_town
    - data_victim_current_location_village
    - data_victim_current_location_latitude
    - data_victim_current_location_longitude
  trafficker: &trafficker_cols
    - data_trafficker_number_of_traffickers
    - data_trafficker_name
    - data_trafficker_nationality
    - data_trafficker_description

mappings:

  # 1. The incident: one hds:Incident per submitted record
  incident_core:
    s: ex:incident_$(data_record_record_id)
    po:
      - [a, hds:Incident]
      - [rdfs:label, $(data_record_title)]
      - [dcterms:description, $(data_record_narrative)]
      - [schema:startDate, $(data_incident_departure_date), xsd:dateTime]
      - [schema:endDate, $(data_incident_destination_date), xsd:dateTime]
      - [hds:victimCount, $(data_victim_number_of_victims), xsd:integer]
      - [hds:reportedBy, ex:agent_$(data_record_source_id)]
      - {p: hds:involves, o: "ex:victim_$(data_victim_victim_id)", when_any: *victim_cols}
      - {p: hds:involves, o: "ex:trafficker_$(data_trafficker_trafficker_id)", when_any: *trafficker_cols}
      - {p: "schema:location", o: "ex:departure_place_$(data_record_record_id)", when_any: *departure_cols}
      - {p: "schema:location", o: "ex:destination_place_$(data_record_record_id)", when_any: *destination_cols}

  # 2. Who reported it: the logged-in user (replaces the old constant ex:EEPA)
  reporter_agent:
    s: ex:agent_$(data_record_source_id)
    po:
      - [a, prov:Agent]

  # 3. People involved
  victim_agent:
    s: ex:victim_$(data_victim_victim_id)
    when_any: *victim_cols
    po:
      - [a, prov:Agent]
      - [hds:actorType, victim]

  trafficker_agent:
    s: ex:trafficker_$(data_trafficker_trafficker_id)
    when_any: *trafficker_cols
    po:
      - [a, prov:Agent]
      - [hds:actorType, trafficker]
      - [foaf:name, $(data_trafficker_name)]

  # 4. Places (departure and destination); the CDM only gives a Location a label.
  # Only created when the record has data for them.
  departure_place_core:
    s: ex:departure_place_$(data_record_record_id)
    when_any: *departure_cols
    po:
      - [a, dcterms:Location]
      - [rdfs:label, $(data_incident_departure_name)]

  destination_place_core:
    s: ex:destination_place_$(data_record_record_id)
    when_any: *destination_cols
    po:
      - [a, dcterms:Location]
      - [rdfs:label, $(data_incident_destination_name)]
